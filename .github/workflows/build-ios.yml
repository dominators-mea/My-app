name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show system info
        run: |
          echo "=== SYSTEM INFO ==="
          sw_vers
          xcodebuild -version
          xcode-select -p
          echo "=== DISK SPACE ==="
          df -h
          echo "=== PROJECT FILES ==="
          ls -la

      - name: Check Flutter install
        run: |
          echo "=== FLUTTER VERSION ==="
          flutter --version || echo "Flutter not found"
          flutter doctor -v

      - name: Get Flutter packages
        run: |
          echo "=== RUNNING FLUTTER PUB GET ==="
          flutter pub get
        continue-on-error: false

      - name: Build iOS without signing
        run: |
          echo "=== BUILDING IOS ==="
          flutter build ipa --no-codesign --verbose
        continue-on-error: false

      - name: List build outputs
        if: always()
        run: |
          echo "=== BUILD OUTPUTS ==="
          ls -la build/ios/ || echo "No iOS build folder"
          ls -la build/ios/ipa/ || echo "No IPA folder"
          ls -la build/ || echo "No build folder"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-and-ipa
          path: |
            build/ios/ipa/*.ipa
            build/
          if-no-files-found: warn
